[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ofi"
version = "1.0.0"
description = "Pre-registered replication of Cont–Kukanov–Stoikov order-flow imbalance on Binance USDⓈ-M perpetuals: explains, doesn't predict"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["market-microstructure", "order-flow-imbalance", "crypto", "replication", "pre-registration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Exact pins on purpose: this is a research artifact, and bootstrap / NLS results should reproduce bit for bit.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
figures = ["matplotlib==3.11.2"]

[project.scripts]
ofi = "ofi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",   # small lambdas are used as local formatters
    "RUF001", # Greek letters and math symbols (β, λ, −) are intentional in strings
    "RUF002",
    "RUF003",
    "SIM108",
    "B905",   # zip() without strict= is fine for same-length arrays
    "RUF007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
